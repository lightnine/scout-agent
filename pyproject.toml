[project]
name = "scout-agent"
version = "0.1.0"
description = "Scout：从零手写的调研型 AI Agent —— Agent Loop、工具调用、分层记忆、证据引用、子 Agent 并行"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
web = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
scout = "scout.cli:main"
scout-web = "scout.web_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # FastAPI 0.141.1 re-exports Starlette's TestClient, whose fallback import
    # of httpx emits this warning. It is not triggered by Scout code.
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning:fastapi\.testclient',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 工具函数的默认值会原样进入 JSON Schema，空列表比 None 更贴合模型的理解，
# 且这些默认值全程只读，不存在 B006 担心的跨调用污染问题。
"src/scout/tools/*" = ["B006"]
"tests/*" = ["B006"]
